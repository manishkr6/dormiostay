# Optional development infrastructure. No application data model is created yet.
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: dormiostay
      POSTGRES_USER: dormiostay_local_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local-only POSTGRES_PASSWORD in your shell}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dormiostay_local_admin -d dormiostay']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4.2-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
