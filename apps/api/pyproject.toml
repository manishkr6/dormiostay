[project]
name = "dormiostay-api"
version = "0.1.0"
description = "DormioStay API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy[asyncio]==2.0.44",
    "alembic==1.17.2",
    "fastapi==0.141.1",
    "asyncpg==0.30.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.10.1",
    "sentry-sdk[fastapi]==2.46.0",
    "uvicorn==0.52.4",
    "pwdlib[argon2]==0.4.2",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==1.18.2",
    "pytest==9.0.2",
    "ruff==0.14.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
