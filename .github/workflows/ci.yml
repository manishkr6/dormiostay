name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dormiostay_test
          POSTGRES_USER: neondb_owner
          POSTGRES_PASSWORD: test_owner_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.10'
      - name: Install API dependencies
        run: |
          uv venv --python 3.12
          uv pip install -r pyproject.toml --group dev
      - name: Lint and check formatting
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Check types
        run: uv run --no-sync mypy
      - name: Provision PostgreSQL test roles and run migrations
        env:
          MIGRATION_URL: postgresql+asyncpg://neondb_owner:test_owner_password@localhost:5432/dormiostay_test
        run: |
          uv run python -c "
          import asyncio, asyncpg
          async def setup():
              conn = await asyncpg.connect('postgresql://neondb_owner:test_owner_password@localhost:5432/dormiostay_test')
              await conn.execute('''
                  DO \$\$
                  BEGIN
                      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'dormiostay_app') THEN
                          CREATE ROLE dormiostay_app WITH LOGIN PASSWORD 'test_app_password' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION;
                      END IF;
                      GRANT CONNECT ON DATABASE dormiostay_test TO dormiostay_app;
                      GRANT USAGE ON SCHEMA public TO dormiostay_app;
                  END
                  \$\$;
              ''')
              await conn.close()
          asyncio.run(setup())
          "
          DATABASE_URL="$MIGRATION_URL" uv run alembic upgrade head
      - name: Live PostgreSQL RLS security tests (T-12)
        env:
          DATABASE_URL: postgresql+asyncpg://dormiostay_app:test_app_password@localhost:5432/dormiostay_test
          OFFLINE_ONLY: '0'
        run: |
          uv run --no-sync pytest tests/security/test_postgres_rls_integration.py -v
      - name: Unit and security tests (T-12)
        run: uv run --no-sync pytest

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:mobile
      - run: npm run typecheck:mobile
      - run: npm run test:mobile
      - run: npm run config:mobile
